name: Protolock source & CLI test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
      GO111MODULE: "on"
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/nilslice/protolock
    name: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: ${{ env.GOPATH }}/src/github.com/nilslice/protolock
      - name: Set Up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: fetch depenencies, test code
        run: |
          go get -v -d ./...
          go test -v -race ./...
      - name:  install binary, test commands
        run: |
          set +o pipefail

          go install ./...
          protolock
          stat proto.lock
          cat proto.lock | grep "testdata:/:test.proto"
          protolock status
          protolock commit

          # a missing plugin must be visible in output AND fail with a
          # non-zero exit code (failures must never be swallowed)
          protolock status --plugins=_not-a-plugin_ 2>&1 | grep "executable file not found"
          if protolock status --plugins=_not-a-plugin_ >/dev/null 2>&1; then
            echo "expected missing plugin to fail status"
            exit 1
          fi

          # a non-forced commit uses the same gate and must be blocked too
          if protolock commit --plugins=_not-a-plugin_ >/dev/null 2>&1; then
            echo "expected missing plugin to fail commit"
            exit 1
          fi
      - name: check output using plugin-sample-error
        run: |
          set +o pipefail

          protolock status --plugins=plugin-sample-error | grep "some error"
      - name: check output using plugin-sample
        run: |
          set +o pipefail

          WARNINGS=$(protolock status --plugins=plugin-sample | wc -l)
          if [ "$WARNINGS" != 2 ]; then
            exit 1
          fi
      - name: check output using plugin-sample-wasm
        run: |
          set +o pipefail

          protolock status --plugins=plugin-samples/plugin-sample-wasm/status.wasm | grep "Extism plugin ran"
      - name: check output using multiple plugins, with one error expected
        run: |
          protolock status \
            --plugins=plugin-sample,plugin-sample-error,plugin-samples/plugin-sample-wasm/status.wasm \
            | grep "some error"

          protolock status --plugins=plugin-sample-error,plugin-sample | grep "some error"
      - name: check output using multiple plugins with errors
        run: |
          set +o pipefail

          ERRS=$(protolock status --plugins=plugin-sample-error,plugin-sample-error 2>&1 | grep "some error" | wc -l)
          if [ "$ERRS" != 2 ]; then # one error line per failed plugin, none swallowed
            exit 1
          fi
          MOREERRS=$(protolock status --plugins=plugin-sample-error,plugin-sample-error,plugin-sample-error 2>&1 | grep "some error" | wc -l)
          if [ "$MOREERRS" != 3 ]; then
            exit 1
          fi

          # failures and warnings are reported together: the healthy plugin's
          # warnings must still be present when another plugin fails
          protolock status --plugins=plugin-sample,plugin-sample-error 2>&1 | grep "A sample warning!"
          protolock status --plugins=plugin-sample-error,plugin-sample 2>&1 | grep "A sample warning!"

          # unparseable plugin output and missing wasm files are failures too
          printf '#!/bin/sh\nprintf "%%s" "not-json"\n' > "$PWD/pp-bad-output"
          chmod +x "$PWD/pp-bad-output"
          if protolock status --plugins="$PWD/pp-bad-output" >/dev/null 2>&1; then
            exit 1
          fi
          if protolock status --plugins="$PWD/does-not-exist.wasm" >/dev/null 2>&1; then
            exit 1
          fi
      - name: remove a test proto file, expect violations.txt to contain data from plugin-sample
        run: |
          set +o pipefail

          rm testdata/test.proto
          protolock status --plugins=plugin-sample || true # let this fail, don't stop CI
          stat violations.txt
          cat violations.txt | grep "Encountered changes in violation of: NoRemovingFieldsWithoutReserve"
      - name: check if proto.lock is up-to-date with the .proto files in the tree
        run: |
          set +o pipefail

          cat >testdata/newProto.proto <<EOL
          syntax = "proto3";
          package testdata;
          message newProto {}
          EOL

          # checkout to HEAD to revert the changes made by previous tests
          git reset --hard HEAD

          # basic status check should not fail even though the lock file is 
          # now technically out of date, compared to the protos
          protolock status     

          NOCHECK=$(protolock status --uptodate=false | wc -l) # false=default 
          if [ "$NOCHECK" != 0 ]; then 
            exit 1
          fi

          CHECK=$(protolock status --uptodate=true | wc -l)
          if [ "$CHECK" = 0 ]; then 
            exit 1
          fi
      - name: check that proto.lock records aggregate options with array values
        run: |
          set +o pipefail

          rm proto.lock && protolock init
          cat proto.lock | grep "4.56"
          cat proto.lock | grep "7.89"